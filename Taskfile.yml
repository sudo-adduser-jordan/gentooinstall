version: "3"

vars:
  BINARY: gentooinstall
  BIN_DIR: ./bin
  GOTESTSUM: go run gotest.tools/gotestsum@v1.13.0
  GOTESTSUM_FLAGS: --format pkgname --hide-summary skipped
  RESET: '\033[0m'
  BLUE: '\033[1;34m'

silent: true

tasks:
  default:
    cmds:
      - task --list

  setup:
    desc: Download Go module dependencies
    cmds:
      - printf '{{.BLUE}}[setup]{{.RESET}} downloading modules\n'
      - go mod download
      - printf '{{.BLUE}}[setup]{{.RESET}} done\n'

  install:
    desc: Install gentooinstall into GOBIN
    cmds:
      - printf '{{.BLUE}}[install]{{.RESET}} go install .\n'
      - go install -trimpath -ldflags "-s -w" .

  update:
    desc: Update Go dependencies and tidy go.mod
    cmds:
      - printf '{{.BLUE}}[update]{{.RESET}} go get -u ./...\n'
      - go get -u ./...
      - go mod tidy

  remove:
    desc: Remove build artifacts
    cmds:
      - printf '{{.BLUE}}[remove]{{.RESET}} {{.BIN_DIR}}\n'
      - rm -rf {{.BIN_DIR}}

  migrate:
    desc: Nothing to migrate for this project
    cmds:
      - printf '{{.BLUE}}[migrate]{{.RESET}} no migrations\n'

  start:
    desc: Build and launch the TUI
    cmds:
      - task: build
      - printf '{{.BLUE}}[start]{{.RESET}} launching TUI\n'
      - '{{.BIN_DIR}}/{{.BINARY}}'

  stop:
    desc: Nothing to stop for this project
    cmds:
      - printf '{{.BLUE}}[stop]{{.RESET}} nothing is running\n'

  dev:
    desc: Format, vet and run the short test suite
    cmds:
      - task: fmt
      - task: vet
      - task: test-short

  build:
    desc: Build ./bin/gentooinstall
    cmds:
      - task: vet
      - printf '{{.BLUE}}[build]{{.RESET}} {{.BIN_DIR}}/{{.BINARY}}\n'
      - mkdir -p {{.BIN_DIR}}
      - go build -trimpath -ldflags "-s -w" -o {{.BIN_DIR}}/{{.BINARY}} .

  test:
    desc: Run the full suite with race detector and coverage
    cmds:
      - task: vet
      - printf '{{.BLUE}}[test]{{.RESET}} full suite\n'
      - mkdir -p {{.BIN_DIR}}
      - '{{.GOTESTSUM}} {{.GOTESTSUM_FLAGS}} -- -count=1 -race -coverprofile={{.BIN_DIR}}/coverage.out ./...'

  test-short:
    desc: Run the short test suite
    cmds:
      - printf '{{.BLUE}}[test-short]{{.RESET}} short suite\n'
      - '{{.GOTESTSUM}} --format short-verbose -- -short -count=1 ./...'

  cover:
    desc: Render the coverage report as HTML
    cmds:
      - task: test
      - printf '{{.BLUE}}[cover]{{.RESET}} {{.BIN_DIR}}/coverage.html\n'
      - go tool cover -html={{.BIN_DIR}}/coverage.out -o {{.BIN_DIR}}/coverage.html

  vet:
    desc: Run go vet
    cmds:
      - printf '{{.BLUE}}[vet]{{.RESET}} go vet ./...\n'
      - go vet ./...

  fmt:
    desc: Format Go sources with gofmt
    cmds:
      - printf '{{.BLUE}}[fmt]{{.RESET}} gofmt -l -w .\n'
      - gofmt -l -w .

  iso:
    desc: Build the bootable live ISO (ISO_OUTPUT overrides the path)
    cmds:
      - |
        bash -Eeuo pipefail -c "$(cat <<'ISO'
        ISO_OUTPUT="${ISO_OUTPUT:-bin/gentooinstall.iso}"
        BUILD_DIR="$PWD/iso_build"
        ROOTFS="$PWD/rootfs"
        trap 'rm -rf "$BUILD_DIR" "$ROOTFS"' EXIT

        log()    { printf '\033[1;34m[iso]\033[0m %s\n' "$*"; }
        die()    { printf '\033[1;31m[iso]\033[0m Error: %s\n' "$*" >&2; exit 1; }
        latest() { curl -fsSL "$1/" | sed -n "s#.*href=\"\\($2\\)\".*#\\1#p" | sort -V | tail -n1; }

        ALPINE_BRANCH=v3.21
        ALPINE_MIRROR=https://dl-cdn.alpinelinux.org/alpine
        MODULES=(virtio virtio_ring virtio_pci virtio_blk virtio_scsi
            scsi_mod sd_mod libata ahci ata_piix ata_generic
            nvme_keyring nvme_auth nvme_core nvme
            usbcore usb_storage uas xhci_pci xhci_hcd
            virtio_net e1000 e1000e r8169 igb ixgbe tg3
            md_mod dm_mod dm_crypt btrfs
            fat vfat nls_cp437 nls_ascii)

        for cmd in go cpio gzip grub-mkrescue curl tar modprobe file; do
            command -v "$cmd" >/dev/null 2>&1 || die "$cmd not found"
        done
        case "$(uname -m)" in
            x86_64|amd64)  GOARCH=amd64;  ALPINE_ARCH=x86_64 ;;
            aarch64|arm64) GOARCH=arm64; ALPINE_ARCH=aarch64 ;;
            *) die "unsupported arch" ;;
        esac

        log "bootstrapping Alpine rootfs ($ALPINE_ARCH)"
        mkdir -p "$ROOTFS"/{dev,proc,sys,tmp,etc} "$BUILD_DIR/boot/grub" "$(dirname "$ISO_OUTPUT")"

        log "compiling init"
        CGO_ENABLED=0 GOOS=linux GOARCH=$GOARCH go build -trimpath -ldflags="-s -w" -o "$ROOTFS/init" .
        chmod 0755 "$ROOTFS/init"

        log "locating kernel"
        KERNEL="$(for d in /boot /boot/efi /lib/modules; do find "$d" -maxdepth 1 -type f -name 'vmlinuz-*' 2>/dev/null; done | sort -V | tail -n1)"
        [[ -n "$KERNEL" ]] || die "no kernel found"
        KERNEL_VER="$(file "$KERNEL" | sed -n 's/.*version \([^ ()]*\).*/\1/p')"
        KERNEL_VER="${KERNEL_VER:-$(uname -r)}"
        MODDIR="/lib/modules/$KERNEL_VER"

        MINIROOTFS="$(latest "$ALPINE_MIRROR/$ALPINE_BRANCH/releases/$ALPINE_ARCH" "alpine-minirootfs-[^\"]*-$ALPINE_ARCH\\.tar\\.gz")"
        [[ -n "$MINIROOTFS" ]] || die "could not resolve minirootfs"
        curl -fsSL -o "$BUILD_DIR/$MINIROOTFS" "$ALPINE_MIRROR/$ALPINE_BRANCH/releases/$ALPINE_ARCH/$MINIROOTFS"
        tar -xzf "$BUILD_DIR/$MINIROOTFS" -C "$ROOTFS"

        APK_TOOLS="$(latest "$ALPINE_MIRROR/$ALPINE_BRANCH/main/$ALPINE_ARCH" "apk-tools-static-[^\"]*\\.apk")"
        [[ -n "$APK_TOOLS" ]] || die "could not resolve apk-tools-static"
        curl -fsSL -o "$BUILD_DIR/$APK_TOOLS" "$ALPINE_MIRROR/$ALPINE_BRANCH/main/$ALPINE_ARCH/$APK_TOOLS"
        tar -xzOf "$BUILD_DIR/$APK_TOOLS" sbin/apk.static > "$BUILD_DIR/apk.static"
        chmod +x "$BUILD_DIR/apk.static"

        log "installing live toolset with apk"
        APK_OUT="$("$BUILD_DIR/apk.static" --root "$ROOTFS" --initdb --allow-untrusted --no-scripts \
            -X "$ALPINE_MIRROR/$ALPINE_BRANCH/main" -X "$ALPINE_MIRROR/$ALPINE_BRANCH/community" \
            add busybox util-linux e2fsprogs dosfstools sgdisk parted gnupg tar xz \
                btrfs-progs mdadm cryptsetup git 2>&1)" || true
        printf '%s\n' "$APK_OUT"
        grep -q '^OK: ' <<<"$APK_OUT" || die "apk install failed"

        mkdir -p "$ROOTFS/etc/udhcpc"
        cat > "$ROOTFS/etc/udhcpc/default.script" <<'EOF'
        #!/bin/sh
        RESOLV_CONF=/etc/resolv.conf
        case "$1" in
            deconfig)
                ip addr flush dev "$interface" 2>/dev/null
                ;;
            bound)
                ip link set "$interface" up
                ip addr add "$ip/24" dev "$interface"
                for r in $router; do
                    ip route del default 2>/dev/null
                    ip route add default via "$r" dev "$interface"
                done
                : > "$RESOLV_CONF"
                for d in $dns; do
                    echo "nameserver $d" >> "$RESOLV_CONF"
                done
                ;;
        esac
        exit 0
        EOF
        chmod +x "$ROOTFS/etc/udhcpc/default.script"

        mkdir -p "$ROOTFS/builds"
        cp builds/*.toml "$ROOTFS/builds/"

        INSTALL_KERNEL_ARGS=""
        if [[ -n "${GENTOOINSTALL_INSTALL_CFG:-}" ]]; then
            cp "$GENTOOINSTALL_INSTALL_CFG" "$ROOTFS/builds/custom.toml"
            INSTALL_KERNEL_ARGS=" gentooinstall.install=/builds/custom.toml"
        fi

        [[ -e /dev/console ]] && cp -a /dev/console "$ROOTFS/dev/console" 2>/dev/null || true
        cp "$KERNEL" "$BUILD_DIR/boot/vmlinuz"

        bundle_mod() {
            local base name
            base="$(basename "$1")"
            case "$base" in
                *.ko.zst) name="${base%.ko.zst}" ;;
                *.ko.gz)  name="${base%.ko.gz}" ;;
                *.ko)     name="${base%.ko}" ;;
                *)        return ;;
            esac
            name="${name//-/_}"
            local out="$ROOTFS/lib/modules/bundle/$name.ko"
            [[ -e "$out" ]] && return
            case "$base" in
                *.zst) command -v zstd >/dev/null 2>&1 && zstd -d -c "$1" > "$out" || echo "Warning: zstd missing, skip $name" >&2 ;;
                *.gz)  gzip -d -c "$1" > "$out" ;;
                *)     cp "$1" "$out" ;;
            esac
            log "bundled module $name"
            return 0
        }

        mkdir -p "$ROOTFS/lib/modules/bundle"
        bundle_find() {
            local alt f
            for alt in "$1" "${1//_/-}"; do
                f="$(find "$MODDIR" -name "$alt.ko*" 2>/dev/null | head -n1)"
                [[ -n "$f" ]] && { bundle_mod "$f"; return 0; }
            done
            return 1
        }
        if [[ -d "$MODDIR" ]]; then
            for m in "${MODULES[@]}"; do
                bundle_find "$m" || continue
            done
        fi
        compgen -G "$ROOTFS/lib/modules/bundle/*.ko" >/dev/null || \
            echo "Warning: no module tree for $KERNEL_VER; disks may need built-in drivers" >&2

        log "building initramfs"
        (cd "$ROOTFS" && find . -print0 | cpio --null -o -H newc --quiet) | gzip -9 > "$BUILD_DIR/boot/initrd.img"

        cat > "$BUILD_DIR/boot/grub/grub.cfg" <<EOF
        set timeout=3
        set default=0
        insmod all_video
        set gfxmode=1024x768,800x600,auto
        insmod gfxterm
        terminal_output gfxterm
        set gfxpayload=keep
        serial --unit=0 --speed=115200
        terminal_input serial console
        terminal_output serial gfxterm

        menuentry "Gentoo Install" {
            linux /boot/vmlinuz quiet console=ttyS0 loglevel=4 rdinit=/init$INSTALL_KERNEL_ARGS
            initrd /boot/initrd.img
        }
        EOF

        grub-mkrescue -o "$ISO_OUTPUT" "$BUILD_DIR"
        log "ISO ready: $ISO_OUTPUT"
        ISO
        )"

  packages:
    desc: Refresh embedded package lists from upstream repos
    cmds:
      - |
        bash -c "$(cat <<'PKG'
        REPO_DIR="data/repos"
        REPOS=(
          "gentoo:https://mirrors.kernel.org/gentoo-portage"
          "guru:https://github.com/gentoo-mirror/guru"
          "kde:https://github.com/gentoo-mirror/kde"
          "cachyos:https://github.com/gentoo-mirror/cachyos"
          "librewolf:https://gitlab.com/librewolf-community/browser/gentoo"
        )

        for ENTRY in "${REPOS[@]}"; do
          DEST="$REPO_DIR/${ENTRY%%:*}.packages"
          printf '\033[1;34m[packages]\033[0m fetching %s -> %s\n' "${ENTRY%%:*}" "$DEST"
          if ! curl -fsSL --max-time 120 "${ENTRY#*:}/metadata/pkg_desc_index" -o "$DEST.tmp"; then
            printf '\033[1;31m[packages]\033[0m download failed; keeping existing %s\n' "$DEST" >&2
            rm -f "$DEST.tmp"
            continue
          fi
          mv "$DEST.tmp" "$DEST"
        done
        PKG
        )"

  vm-test:
    desc: QEMU e2e - boot the ISO to the TUI on the serial console
    cmds:
      - task: vet
      - printf '{{.BLUE}}[vm-test]{{.RESET}} TestISOBoots\n'
      - 'GENTOOINSTALL_E2E=1 {{.GOTESTSUM}} --format testname -- -count=1 -v -run ''TestISOBoots$'' ./tests/'

  vm-test-net:
    desc: QEMU e2e - network, DHCP and mirror reachability
    cmds:
      - task: vet
      - printf '{{.BLUE}}[vm-test-net]{{.RESET}} TestISOBootNetwork\n'
      - 'GENTOOINSTALL_E2E=1 GENTOOINSTALL_E2E_NET=1 {{.GOTESTSUM}} --format testname -- -count=1 -v -run ''TestISOBootNetwork$'' ./tests/'

  vm-install:
    desc: QEMU e2e - full headless install for every builds/*.toml (slow)
    cmds:
      - task: vet
      - printf '{{.BLUE}}[vm-install]{{.RESET}} TestInstallInVM\n'
      - 'GENTOOINSTALL_E2E=1 GENTOOINSTALL_E2E_INSTALL=1 {{.GOTESTSUM}} --format testname -- -count=1 -v -run ''TestInstallInVM$'' ./tests/'
