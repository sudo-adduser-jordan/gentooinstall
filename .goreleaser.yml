version: 2

project_name: gentooinstall

env:
  - CGO_ENABLED=0

before:
  hooks: []

builds:
  - id: gentooinstall
    main: .
    binary: gentooinstall
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: gentooinstall
    formats:
      - tar.gz
    files:
      - src: builds/*.toml
        dst: builds

source:
  enabled: true

checksum:
  name_template: 'checksums.txt'

release:
  extra_files:
    - glob: ./live/gentooinstall-live-amd64.iso

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^readme:'