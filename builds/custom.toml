[disk]
    scheme = "classic_single_disk"
    boot_type = "efi"
    device = "/dev/sdX"
    boot_device = ""
    use_swap = true
    swap_size = "8GiB"
    swap_device = ""
    use_luks = false
    root_fs = "ext4"
    zfs_pool_type = "standard"
    zfs_encrypt = false
    zfs_use_compression = false
    zfs_compression = "zstd"
    btrfs_raid_type = "raid0"

[system]
    hostname = "gentoo"
    timezone = "US/Pacific"
    keymap = "us"
    keymap_initramfs_other = false
    keymap_initramfs = "us"
    locales = ["C.UTF-8 UTF-8"]
    locale = "C.UTF-8"
    systemd_networkd = true
    systemd_networkd_interface_name = "en*"
    systemd_networkd_dhcp = true
    systemd_networkd_addresses = ["192.168.1.100/32", "fd00::1/64"]
    systemd_networkd_gateway = "192.168.1.1"
    initramfs_sshd = false

[gentoo]
    mirror = "https://mirror.leaseweb.com/gentoo"
    arch = "amd64"
    subarch = ""
    stage3_variant = "desktop-systemd"
    profile = "default/linux/amd64/23.0/desktop/kde/systemd"
    portage_sync_type = "git"
    portage_git_full_history = false
    portage_git_mirror = "https://anongit.gentoo.org/git/repo/sync/gentoo.git"
    use_portage_testing = true
    select_mirrors = false
    select_mirrors_large_file = false

[packages]
    additional = ["app-admin/sudo", "app-editors/nano", "dev-vcs/git", "net-misc/curl", "net-misc/networkmanager", "net-misc/openssh", "net-misc/wget", "sys-process/btop", "www-client/librewolf"]
    enabling_repos = ["guru", "librewolf"]
    enable_sshd = true
    enable_binpkg = false
    kernel_type = "bin"
    kernel_deblob = false

[makeconf]
    options = ["jobs", "binpkg", "accept_license"]
    extra = ""
