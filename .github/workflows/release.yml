name: Release

on:
  workflow_dispatch: {} 
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build live ISO
        run: |
          sudo apt-get update
          sudo apt-get install -y grub-pc-bin grub-efi-amd64-bin xorriso busybox-static mtools
          # Hosted Azure kernel isn't world-readable; grant read, then build.
          sudo chmod 644 "/boot/vmlinuz-$(uname -r)"
          scripts/release.sh
          # ISO builds to dist/ (goreleaser default); move it to live/ first so
          # `goreleaser --clean` below never wipes it.
          mkdir -p live
          mv dist/gentooinstall-live-amd64.iso live/gentooinstall-live-amd64.iso

      - name: Run goreleaser (release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run goreleaser (snapshot)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
