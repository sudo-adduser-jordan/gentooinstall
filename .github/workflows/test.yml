name: Test

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "internal/**"
      - "cmd/**"
      - "tests/**"
      - "builds/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "internal/**"
      - "cmd/**"
      - "tests/**"
      - "builds/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Run tests
        run: make test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-out
          path: bin/coverage.out
          if-no-files-found: ignore
