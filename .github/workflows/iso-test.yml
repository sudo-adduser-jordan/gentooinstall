name: ISO Test

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "internal/**"
      - "cmd/**"
      - "tests/**"
      - "scripts/release.sh"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/iso-test.yml"
  pull_request:
    paths:
      - "internal/**"
      - "cmd/**"
      - "tests/**"
      - "scripts/release.sh"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/iso-test.yml"

jobs:
  iso-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 grub-pc-bin grub-efi-amd64-bin xorriso cpio mtools shellcheck
          ls -l /boot/vmlinuz* || true
          if [ -e "/boot/vmlinuz-$(uname -r)" ]; then sudo chmod 644 "/boot/vmlinuz-$(uname -r)"; fi
          qemu-system-x86_64 --version
          xorriso --version | head -n 5
      - name: Shellcheck release.sh
        run: shellcheck -S warning scripts/release.sh
      - name: Run ISO boot test
        run: make vm-test
