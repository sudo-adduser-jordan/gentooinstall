name: Demo
on:
  workflow_dispatch: {} 
  push:
    branches: [main]
    paths:
      - "main.go"
      - "lib/tui/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/demo-gif.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build gentooinstall
        run: go build -o bin/gentooinstall .

      - name: Install vhs
        # Pinned for reproducible recordings; vhs ships its own Chromium and
        # font handling, so @latest can shift emoji metrics any run.
        run: |
          go install github.com/charmbracelet/vhs@v0.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install ffmpeg, ttyd and emoji font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg ttyd fonts-noto-color-emoji

      - name: Verify emoji font
        # The tape's FontFamily stack assumes Noto Color Emoji renders the
        # tab icons at a uniform 2-cell advance; fail fast if fontconfig
        # cannot see it instead of recording misaligned tabs.
        run: |
          sudo fc-cache -f >/dev/null
          fc-match "Noto Color Emoji"
          test "$(fc-list | grep -ci emoji)" -ge 1

      - name: Record demo.gif
        env:
          CI: ""
        run: ./bin/gentooinstall gif

      - name: Commit updated demo.gif
        run: |
          git config user.name "gentooinstall bot"
          git config user.email "noreply@gentooinstall.local"
          if git diff --quiet demo.gif; then
            echo "No change to demo.gif."
            exit 0
          fi
          git add demo.gif
          git commit -m "chore: regenerate demo gif"
          git pull --rebase origin main
          git push