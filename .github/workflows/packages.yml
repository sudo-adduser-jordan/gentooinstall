name: Update packages

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - name: Refresh package lists
        run: task packages

      - name: Commit updated lists
        run: |
          git config user.name "gentooinstall bot"
          git config user.email "noreply@gentooinstall.local"
          if git diff --quiet data/repos; then
            echo "No changes to package lists."
            exit 0
          fi
          git add data/repos
          git commit -m "chore: update embedded package lists"
          git push
