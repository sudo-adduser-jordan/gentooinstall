name: ISO Test

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "main.go"
      - "tests/**"
      - "Taskfile.yml"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/iso-test.yml"
  pull_request:
    paths:
      - "lib/**"
      - "main.go"
      - "tests/**"
      - "Taskfile.yml"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/iso-test.yml"

jobs:
  iso-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 grub-pc-bin grub-efi-amd64-bin xorriso cpio mtools
          ls -l /boot/vmlinuz* || true
          if [ -e "/boot/vmlinuz-$(uname -r)" ]; then sudo chmod 644 "/boot/vmlinuz-$(uname -r)"; fi
          qemu-system-x86_64 --version
          xorriso --version | head -n 5
      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1
      - name: Run ISO boot test
        run: task vm-test
